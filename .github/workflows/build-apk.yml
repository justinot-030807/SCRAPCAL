name: Build SCRAPCAL Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Upload SCRAPCAL.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run unit and widget tests
        run: flutter test

      - name: Build installable release APK
        run: flutter build apk --release

      - name: Rename output APK to SCRAPCAL.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk SCRAPCAL.apk

      - name: Upload SCRAPCAL.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCRAPCAL-apk
          path: SCRAPCAL.apk
          if-no-files-found: error
